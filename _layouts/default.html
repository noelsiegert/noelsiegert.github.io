<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header>
    <nav>
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>About</a>
      <a href="{{ '/cv/' | relative_url }}" {% if page.url == '/cv/' %}class="active"{% endif %}>CV</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

 <footer>
  <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }} &middot; Last updated {{ site.time | date: "%B %-d, %Y" }}</p>
</footer>
</body>
</html>
